<div class="epg-header">
  <div class="epg-header-datetime">
    <span>{{ (now * 1000) | date: "EEE, d MMM, h:mm a" }}</span>
    <div class="epg-pan-controls">
      <svg (click)="panBack()" ngbTooltip="Back" class="pan-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
      </svg>
      <svg *ngIf="offsetSeconds !== 0" (click)="resetToNow()" ngbTooltip="Back to now" class="pan-icon now-icon"
        fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z" />
      </svg>
      <svg (click)="panForward()" ngbTooltip="Forward" class="pan-icon" fill="currentColor" viewBox="0 0 24 24">
        <path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z" />
      </svg>
    </div>
  </div>
  <div class="epg-header-ruler">
    <div class="tick" *ngFor="let t of ticks()" [style.left.%]="tickPercent(t)">{{ tickLabel(t) }}</div>
    <div class="now-line" *ngIf="showNowLine()" [style.left.%]="nowPercent()"></div>
  </div>
</div>
