<ng-keyboard-shortcuts [shortcuts]="shortcuts"></ng-keyboard-shortcuts>
<ng-keyboard-shortcuts-help [key]="'f1'" [closeKey]="'escape'" [title]="'Help'" />
<div class="app-shell">
  <app-nav-rail [active]="currentRailItem" (select)="selectRail($event)"></app-nav-rail>
  <app-playlist-sidebar *ngIf="sidebarVisible()" [mediaType]="sidebarMediaType()"
    [selectedSourceIds]="filters?.source_ids" [selectedGroupId]="filters?.group_id"
    (sourceSelect)="onSourceSelect($event)" (widthChange)="sidebarWidthPx = $event"></app-playlist-sidebar>
  <div class="main-content" [style.margin-left.px]="mainContentMarginPx()">
    <div class="main-toolbar">
    <div class="row mb-3">
      <div class="mx-auto col-md-8 col-12">
        <div class="search-box">
          <input autocomplete="off" type="text" id="search" #search style="width: 100%" class="form-control"
            placeholder="Type to search..." />
          <svg (click)="toggleKeywords()" *ngIf="!filters?.use_keywords" class="keyword-search-icon"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>Search By Keywords</title>
            <path
              d="M22 13C22 13.53 21.79 14.04 21.41 14.41L21 14.83C20.91 11.97 18.84 9.62 16.11 9.11L11 4H4V11L9.11 16.11C9.62 18.84 11.97 20.91 14.83 21L14.41 21.41C14.04 21.79 13.53 22 13 22C12.47 22 11.97 21.79 11.59 21.42L2.59 12.42C2.21 12.04 2 11.53 2 11V4C2 2.9 2.9 2 4 2H11C11.53 2 12.04 2.21 12.41 2.58L21.41 11.58C21.79 11.96 22 12.47 22 13M5 6.5C5 7.33 5.67 8 6.5 8S8 7.33 8 6.5 7.33 5 6.5 5 5 5.67 5 6.5M15.11 10.61C12.61 10.61 10.61 12.61 10.61 15.11S12.61 19.61 15.11 19.61C16 19.61 16.8 19.36 17.5 18.93L20.61 22L22 20.61L18.92 17.5C19.36 16.82 19.61 16 19.61 15.11C19.61 12.61 17.61 10.61 15.11 10.61M15.11 12.61C16.5 12.61 17.61 13.73 17.61 15.11S16.5 17.61 15.11 17.61 12.61 16.5 12.61 15.11 13.73 12.61 15.11 12.61" />
          </svg>
          <svg (click)="toggleKeywords()" *ngIf="filters?.use_keywords" class="keyword-search-icon"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>Search By Keywords</title>
            <path
              d="M21.41 11.58L12.41 2.58C12.05 2.22 11.55 2 11 2H4C2.89 2 2 2.89 2 4V11C2 11.55 2.22 12.05 2.59 12.41L11.58 21.41C11.95 21.77 12.45 22 13 22S14.05 21.77 14.41 21.41L14.83 21C11.6 20.9 9 18.26 9 15C9 11.69 11.69 9 15 9C18.26 9 20.9 11.6 21 14.83L21.41 14.41C21.78 14.05 22 13.55 22 13C22 12.44 21.77 11.94 21.41 11.58M5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7M15.11 10.61C17.61 10.61 19.61 12.61 19.61 15.11C19.61 16 19.36 16.82 18.92 17.5L22 20.61L20.61 22L17.5 18.93C16.8 19.36 16 19.61 15.11 19.61C12.61 19.61 10.61 17.61 10.61 15.11S12.61 10.61 15.11 10.61M15.11 12.61C13.73 12.61 12.61 13.73 12.61 15.11S13.73 17.61 15.11 17.61 17.61 16.5 17.61 15.11 16.5 12.61 15.11 12.61" />
          </svg>
          <svg (click)="reload()" class="reload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>Reload View</title>
            <path
              d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" />
          </svg>
          <svg class="bulk-action-icon" [matMenuTriggerFor]="bulkMenu"
            [class.disabled]="filters?.series_id && !filters?.season" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24">
            <title>Bulk Actions</title>
            <path
              d="M6,2A4,4 0 0,1 10,6V8H14V6A4,4 0 0,1 18,2A4,4 0 0,1 22,6A4,4 0 0,1 18,10H16V14H18A4,4 0 0,1 22,18A4,4 0 0,1 18,22A4,4 0 0,1 14,18V16H10V18A4,4 0 0,1 6,22A4,4 0 0,1 2,18A4,4 0 0,1 6,14H8V10H6A4,4 0 0,1 2,6A4,4 0 0,1 6,2M16,18A2,2 0 0,0 18,20A2,2 0 0,0 20,18A2,2 0 0,0 18,16H16V18M14,10H10V14H14V10M6,16A2,2 0 0,0 4,18A2,2 0 0,0 6,20A2,2 0 0,0 8,18V16H6M8,6A2,2 0 0,0 6,4A2,2 0 0,0 4,6A2,2 0 0,0 6,8H8V6M18,8A2,2 0 0,0 20,6A2,2 0 0,0 18,4A2,2 0 0,0 16,6V8H18Z" />
          </svg>
          <mat-menu #bulkMenu="matMenu">
            <button mat-menu-item (click)="bulkAction(bulkActionType.Hide)">Hide all</button>
            <button mat-menu-item (click)="bulkAction(bulkActionType.Unhide)">Unhide all</button>
            <button mat-menu-item (click)="bulkAction(bulkActionType.Favorite)"
              [disabled]="filters?.view_type == viewModeEnum.Categories">Favorite all</button>
            <button mat-menu-item (click)="bulkAction(bulkActionType.Unfavorite)"
              [disabled]="filters?.view_type == viewModeEnum.Categories">Unfavorite all</button>
          </mat-menu>
          <app-sort-button></app-sort-button>
        </div>
      </div>
    </div>

    <div class="mx-auto text-center back-row" style="margin-bottom: 1rem" *ngIf="nodeStack.hasNodes()" @fadeInOut
      (click)="goBack()">
      <svg class="back-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <title>Back</title>
        <path fill="currentColor"
          d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
      </svg>
      <span class="back-label">{{ nodeStack.get()?.name }}</span>
    </div>
    <div class="mx-auto filterBox" style="margin-bottom: 1rem" *ngIf="filtersVisible()" @fadeInOut>
      <div class="form-check form-check-inline form-switch">
        <input [(ngModel)]="chkLiveStream" (ngModelChange)="updateMediaTypes(mediaTypeEnum.livestream)"
          class="form-check-input" id="filter-0" type="checkbox" />
        <label class="form-check-label" for="filter-0"> Livestreams </label>
      </div>
      <div class="form-check form-check-inline form-switch">
        <input [(ngModel)]="chkMovie" (ngModelChange)="updateMediaTypes(mediaTypeEnum.movie)" class="form-check-input"
          id="filter-1" type="checkbox" />
        <label *ngIf="anyXtream()" class="form-check-label" for="filter-1"> Movies/Vods </label>
        <label *ngIf="!anyXtream()"> Movies/Vods/Series </label>
      </div>
      <div *ngIf="anyXtream()" class="form-check form-check-inline form-switch">
        <input [(ngModel)]="chkSerie" (ngModelChange)="updateMediaTypes(mediaTypeEnum.serie)" class="form-check-input"
          id="filter-2" type="checkbox" />
        <label class="form-check-label" for="filter-2"> Series </label>
      </div>
    </div>
    <div class="mx-auto text-center" style="margin-bottom: 1rem" *ngIf="currentRailItem === railItemEnum.History"
      @fadeInOut>
      <button [disabled]="memory.Loading" (click)="clearHistory()"
        class="btn btn-secondary d-inline-flex align-items-center">
        Clear history
        <svg class="history ms-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path fill="currentColor"
            d="M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3" />
        </svg>
      </button>
    </div>
    <app-epg-timeline-header *ngIf="isChannelListView()"></app-epg-timeline-header>
    </div>

    <cdk-virtual-scroll-viewport *ngIf="isChannelListView()" #virtualViewport [itemSize]="rowItemSizePx()"
      minBufferPx="300" maxBufferPx="500" class="virtual-viewport"
      [class.fav-channels-viewport]="showFavMediaSection()"
      [@fade]="channelsVisible ? 'visible' : 'hidden'">
      <app-channel-tile [attr.id]="i == 0 ? 'first' : null"
        *cdkVirtualFor="let channel of channels; let i = index; trackBy: trackByChannel" class="channel-list-row"
        [id]="i" [channel]="channel" [viewMode]="viewType" layout="list"></app-channel-tile>
    </cdk-virtual-scroll-viewport>
    <cdk-virtual-scroll-viewport *ngIf="!isChannelListView()" #virtualViewport [itemSize]="rowItemSizePx()"
      minBufferPx="600" maxBufferPx="900" class="virtual-viewport"
      [@fade]="channelsVisible ? 'visible' : 'hidden'">
      <div class="grid-row" *cdkVirtualFor="let row of channelRows(); let ri = index">
        <app-channel-tile *ngFor="let channel of row; let ci = index; trackBy: trackByChannel"
          [attr.id]="ri == 0 && ci == 0 ? 'first' : null" class="grid-tile" [id]="ri * tilesPerRow() + ci"
          [channel]="channel" [viewMode]="viewType"></app-channel-tile>
      </div>
    </cdk-virtual-scroll-viewport>
    <cdk-virtual-scroll-viewport *ngIf="showFavMediaSection()" #favMediaViewport [itemSize]="88"
      minBufferPx="600" maxBufferPx="900" class="virtual-viewport fav-media-viewport">
      <div class="grid-row" *cdkVirtualFor="let row of favMediaChannelRows(); let ri = index">
        <app-channel-tile *ngFor="let channel of row; trackBy: trackByChannel" class="grid-tile" [channel]="channel"
          [viewMode]="viewType"></app-channel-tile>
      </div>
    </cdk-virtual-scroll-viewport>
  </div>
</div>

<div *ngIf="showScrollTop" (click)="scrollToTop()" class="scroll-to-top">
  <svg viewBox="0 0 24 24">
    <path fill="currentColor" d="M7.41,15.41L12,10.83L16.59,15.41L18,14L12,8L6,14L7.41,15.41Z" />
  </svg>
</div>
