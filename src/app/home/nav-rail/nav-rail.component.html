<nav class="nav-rail">
  <div class="rail-logo">
    <img src="assets/app-icon.png" alt="Fred TV" />
  </div>
  <button *ngFor="let entry of items; let i = index" [id]="'viewMode-' + i" type="button" class="rail-item"
    [ngbTooltip]="entry.label" placement="right" [ngClass]="{ active: active == entry.item }"
    (click)="click(entry.item)">
    <svg *ngIf="entry.item == railItemEnum.Favourites" fill="currentColor" viewBox="0 0 24 24" class="rail-icon">
      <path
        d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z" />
    </svg>
    <svg *ngIf="entry.item == railItemEnum.Channels" fill="currentColor" viewBox="0 0 24 24" class="rail-icon">
      <path
        d="M21,3H3C1.89,3 1,3.89 1,5V17A2,2 0 0,0 3,19H8V21H16V19H21A2,2 0 0,0 23,17V5C23,3.89 22.1,3 21,3M21,17H3V5H21V17Z" />
    </svg>
    <svg *ngIf="entry.item == railItemEnum.Movies" fill="currentColor" viewBox="0 0 24 24" class="rail-icon">
      <path d="M18,4L20,8H17L15,4H13L15,8H12L10,4H8L10,8H7L5,4H4A2,2 0 0,0 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V4H18Z" />
    </svg>
    <svg *ngIf="entry.item == railItemEnum.Series" fill="currentColor" viewBox="0 0 24 24" class="rail-icon">
      <path
        d="M18,4H4C2.89,4 2,4.89 2,6V16H4V6H18V4M22,8H8C6.89,8 6,8.89 6,10V20C6,21.11 6.89,22 8,22H22C23.11,22 24,21.11 24,20V10C24,8.89 23.11,8 22,8M16,17L11.5,14.5V19.5L16,17Z" />
    </svg>
    <svg *ngIf="entry.item == railItemEnum.History" fill="currentColor" viewBox="0 0 24 24" class="rail-icon">
      <path
        d="M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3M12,8V13L16.28,15.54L17,14.33L13.5,12.25V8H12Z" />
    </svg>
    <svg *ngIf="entry.item == railItemEnum.ManageCategories" fill="currentColor" viewBox="0 0 24 24"
      class="rail-icon">
      <path
        d="M3,5H9V11H3V5M5,7V9H7V7H5M11,7H21V9H11V7M11,15H21V17H11V15M5,13.5L7.5,16L12.5,11L11.08,9.58L7.5,13.17L6.42,12.08L5,13.5Z" />
    </svg>
    <span class="rail-label">{{ entry.label }}</span>
  </button>

    placement="right" (click)="click(railItemEnum.Settings)">

      <path

    </svg>
    <span class="rail-label">Settings</span>
  </button>
</nav>
